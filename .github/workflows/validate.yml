name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://core_console_test:core_console_test@localhost:5432/core_console_test

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: core_console_test
          POSTGRES_USER: core_console_test
          POSTGRES_PASSWORD: core_console_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=core_console_test --dbname=core_console_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run complete validation
        run: uv run --frozen python scripts/validate.py

      - name: Build wheel
        run: |
          wheel_dir="${RUNNER_TEMP}/core-console-wheel"
          uv build --wheel --out-dir "$wheel_dir"

          shopt -s nullglob
          wheels=("$wheel_dir"/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          echo "WHEEL_PATH=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Validate isolated wheel installation
        run: |
          package_venv="${RUNNER_TEMP}/core-console-install"
          .venv/bin/python -m venv "$package_venv"
          uv pip install --strict --python "$package_venv/bin/python" "$WHEEL_PATH"

          cd "$RUNNER_TEMP"
          "$package_venv/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/validate_installation.py"
