[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "core-console"
version = "0.1.0"
description = "Core Console main backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn==0.52.0",
]

[project.scripts]
start = "core_console.cli:start"

[dependency-groups]
dev = [
    "anyio==4.14.2",
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.uv]
required-version = "==0.12.0"

[tool.hatch.build.targets.wheel]
packages = ["src/core_console"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts", "migrations/env.py"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
